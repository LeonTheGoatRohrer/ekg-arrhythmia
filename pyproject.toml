[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ekg"
version = "0.1.0"
readme = "README.md"
license = "MIT"
authors = [{ name = "Leon Rohrer" }]
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "wfdb", "torch", "scikit-learn", "fastapi", "uvicorn", "httpx"]

[project.urls]
Homepage = "https://leonrohrer.at/ekg-arrhythmia/"
Repository = "https://github.com/LeonTheGoatRohrer/ekg-arrhythmia"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
